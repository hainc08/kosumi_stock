version: '3.9'

services:
  mariadb:
    image: mariadb:11
    container_name: wms_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_secret
      MARIADB_DATABASE: wms_db
      MARIADB_USER: wms_user
      MARIADB_PASSWORD: wms_secret
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', 'localhost', '-uroot', '-proot_secret']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms_backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql://wms_user:wms_secret@mariadb:3306/wms_db
    ports:
      - '3001:3001'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  mariadb_data:
